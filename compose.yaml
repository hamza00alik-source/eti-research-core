services:
  api:
    build: .
    image: eti-research-core:local
    restart: unless-stopped
    environment:
      ETI_DATABASE_PATH: /app/data/eti.sqlite3
      ETI_ARTIFACT_DIR: /app/data/artifacts
      ETI_EMBEDDED_WORKER: "0"
      ETI_BACKUP_ENABLED: ${ETI_BACKUP_ENABLED:-0}
      ETI_BACKUP_INTERVAL_SECONDS: ${ETI_BACKUP_INTERVAL_SECONDS:-86400}
      ETI_BACKUP_RETENTION_DAYS: ${ETI_BACKUP_RETENTION_DAYS:-30}
      ETI_BACKUP_S3_ENDPOINT: ${ETI_BACKUP_S3_ENDPOINT:-}
      ETI_BACKUP_S3_BUCKET: ${ETI_BACKUP_S3_BUCKET:-}
      ETI_BACKUP_S3_ACCESS_KEY_ID: ${ETI_BACKUP_S3_ACCESS_KEY_ID:-}
      ETI_BACKUP_S3_SECRET_ACCESS_KEY: ${ETI_BACKUP_S3_SECRET_ACCESS_KEY:-}
      ETI_BACKUP_S3_REGION: ${ETI_BACKUP_S3_REGION:-}
      ETI_BACKUP_S3_ADDRESSING_STYLE: ${ETI_BACKUP_S3_ADDRESSING_STYLE:-path}
      ETI_BACKUP_PREFIX: ${ETI_BACKUP_PREFIX:-eti/sqlite}
      ETI_BACKUP_ENCRYPTION_KEY: ${ETI_BACKUP_ENCRYPTION_KEY:-}
      ETI_AUTH_SECRET: ${ETI_AUTH_SECRET:?Set ETI_AUTH_SECRET in .env}
      ETI_REGISTRATION_KEY: ${ETI_REGISTRATION_KEY:?Set ETI_REGISTRATION_KEY in .env}
      ETI_ADMIN_USERNAMES: ${ETI_ADMIN_USERNAMES:-}
    ports:
      - "${ETI_BIND_ADDRESS:-127.0.0.1}:${ETI_PORT:-8000}:8000"
    volumes:
      - eti-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  worker:
    image: eti-research-core:local
    build: .
    restart: unless-stopped
    command: ["python", "-m", "eti.worker", "--poll-seconds", "2"]
    environment:
      ETI_DATABASE_PATH: /app/data/eti.sqlite3
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - eti-data:/app/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  eti-data:
