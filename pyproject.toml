[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eti-research-core"
version = "0.2.0"
description = "Research-only quantitative and AI trading intelligence core"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3", "ccxt>=4.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
