name: Run ETI Kaggle Training

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: "Confirm that you want to start a Kaggle CPU run (uses Kaggle compute quota)"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: eti-kaggle-training
  cancel-in-progress: false

jobs:
  train:
    if: inputs.confirm_run == 'yes'
    environment: hamza00alik
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out ETI main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Configure Kaggle API token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Missing KAGGLE_API_TOKEN in the hamza00alik GitHub Actions environment. Generate a Kaggle API token and save it as that environment secret."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"

      - name: Prepare metadata for the existing Kaggle kernel
        env:
          KERNEL: hamza00alik/eti-first-training-kaggle
        run: |
          mkdir -p kaggle_kernel
          python - <<'PY'
          import json, os
          from pathlib import Path

          expected_id = os.environ["KERNEL"]
          metadata = {
              "id": expected_id,
              "title": "ETI First Training Kaggle",
              "code_file": "eti-first-training-kaggle.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "false",
              "enable_internet": "true",
              "machine_shape": "",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          out = Path("kaggle_kernel")
          (out / metadata["code_file"]).write_bytes(
              Path("notebooks/ETI_v0_1_Training.ipynb").read_bytes()
          )
          (out / "kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n"
          )
          check = json.loads((out / "kernel-metadata.json").read_text())
          assert check["id"] == expected_id
          assert check["is_private"] == "true"
          assert check["enable_internet"] == "true"
          print("Prepared canonical notebook and explicit metadata for " + expected_id)
          print("Private: true | CPU-only: true | Internet: true")
          PY

      - name: Push canonical notebook and start Kaggle run
        run: kaggle kernels push -p kaggle_kernel --timeout 7200
