name: ETI mobile ONNX export checks

on:
  pull_request:
    paths:
      - "eti/mobile_export.py"
      - "tests/test_mobile_export.py"
      - "requirements-mobile.txt"
      - ".github/workflows/mobile-export-checks.yml"
  push:
    branches: [main]
    paths:
      - "eti/mobile_export.py"
      - "tests/test_mobile_export.py"
      - "requirements-mobile.txt"
      - ".github/workflows/mobile-export-checks.yml"

permissions:
  contents: read

jobs:
  onnx-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ETI and mobile export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mobile.txt
      - name: Verify ETI to ONNX CPU inference parity
        run: python -m pytest -q tests/test_mobile_export.py
