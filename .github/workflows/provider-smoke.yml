name: ETI public provider runtime smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"
  push:
    branches: [main]
    paths:
      - "eti/provider_smoke.py"
      - ".github/workflows/provider-smoke.yml"

permissions:
  contents: read

concurrency:
  group: eti-public-provider-smoke
  cancel-in-progress: false

jobs:
  public-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal public-data dependencies
        run: python -m pip install --upgrade pip ccxt pandas numpy
      - name: Probe Coinbase Exchange and Kraken public spot data
        run: python -m eti.provider_smoke --output artifacts/provider-smoke.json --min-rows 50 --require-all
      - name: Upload provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eti-public-provider-smoke
          path: artifacts/provider-smoke.json
          if-no-files-found: warn
          retention-days: 14
