name: ETI research core checks

on:
  push:
    branches: [main, "feature/**", "solana-research-paper-only"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q eti tests
      - run: node --check web/app.js
      - run: node --check web/sw.js
      - run: python -m pytest -q
      - name: Validate deployment Compose configuration
        env:
          ETI_AUTH_SECRET: ci-only-secret-not-used-for-deployment-000000000000
          ETI_REGISTRATION_KEY: ci-only-invite-key-not-used-for-deployment
        run: docker compose config --quiet
      - name: Build production container image
        run: docker build --pull --tag eti-research-core:ci .
