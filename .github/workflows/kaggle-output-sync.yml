name: Retrieve ETI Kaggle Training Output

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kaggle-output-sync.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      kernel:
        description: "Kaggle notebook slug (owner/notebook)"
        required: false
        default: "hamza00alik/eti-first-training-kaggle"

permissions:
  contents: read

concurrency:
  group: eti-kaggle-output-sync
  cancel-in-progress: false

jobs:
  retrieve-training-output:
    environment: hamza00alik
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out canonical ETI source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Configure Kaggle API token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_HAMZA00ALIK || secrets.HAMZA00ALIK }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Kaggle API token unavailable. Configure KAGGLE_API_TOKEN, KAGGLE_HAMZA00ALIK, or HAMZA00ALIK in the hamza00alik environment secrets."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"

      - name: Wait for the latest Kaggle execution to finish
        env:
          KERNEL: ${{ inputs.kernel || 'hamza00alik/eti-first-training-kaggle' }}
        run: |
          # Kaggle output is only downloadable after the pushed kernel version completes.
          # Poll status rather than racing the asynchronous Kaggle worker.
          for attempt in $(seq 1 30); do
            status="$(kaggle kernels status "$KERNEL" 2>&1)" || status="status unavailable: $status"
            echo "Kaggle status check $attempt/30: $status"
            case "$status" in
              *COMPLETE*|*Complete*|*complete*)
                echo "Kaggle execution completed."
                exit 0
                ;;
              *ERROR*|*Error*|*error*|*CANCELLED*|*Cancelled*|*cancelled*)
                echo "::error::Kaggle reports a failed or cancelled execution: $status"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::Kaggle execution did not reach a completed state within 15 minutes."
          exit 1

      - name: Verify remote Kaggle source matches canonical repository notebook
        env:
          KERNEL: ${{ inputs.kernel || 'hamza00alik/eti-first-training-kaggle' }}
        run: |
          mkdir -p remote_kernel
          kaggle kernels pull "$KERNEL" -p remote_kernel
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          canonical_path = Path("notebooks/ETI_v0_1_Training.ipynb")
          canonical = json.loads(canonical_path.read_text())
          remote_paths = list(Path("remote_kernel").rglob("*.ipynb"))
          if len(remote_paths) != 1:
              raise SystemExit(
                  f"Expected one remote Kaggle notebook source; found {[str(p) for p in remote_paths]}"
              )
          remote = json.loads(remote_paths[0].read_text())

          def code_cells(notebook):
              return [
                  "\n".join(cell.get("source", []))
                  if isinstance(cell.get("source", []), list)
                  else cell.get("source", "")
                  for cell in notebook.get("cells", [])
                  if cell.get("cell_type") == "code"
              ]

          expected = code_cells(canonical)
          actual = code_cells(remote)
          if expected != actual:
              print(
                  "Remote Kaggle source differs from canonical source; "
                  "automatically pushing the reviewed main-branch notebook."
              )
              kernel_dir = Path("kaggle_kernel")
              kernel_dir.mkdir(exist_ok=True)
              metadata = {
                  "id": os.environ["KERNEL"],
                  "title": "ETI First Training Kaggle",
                  "code_file": "eti-first-training-kaggle.ipynb",
                  "language": "python",
                  "kernel_type": "notebook",
                  "is_private": "true",
                  "enable_gpu": "false",
                  "enable_internet": "true",
                  "machine_shape": "",
                  "dataset_sources": [],
                  "competition_sources": [],
                  "kernel_sources": [],
                  "model_sources": [],
              }
              (kernel_dir / metadata["code_file"]).write_bytes(canonical_path.read_bytes())
              (kernel_dir / "kernel-metadata.json").write_text(json.dumps(metadata, indent=2) + "\\n")
              push = __import__("subprocess").run(
                  ["kaggle", "kernels", "push", "-p", str(kernel_dir), "--timeout", "7200"],
                  check=False,
                  text=True,
                  capture_output=True,
              )
              print(push.stdout)
              if push.stderr:
                  print(push.stderr)
              if push.returncode:
                  raise SystemExit(f"Automatic canonical Kaggle push failed: {push.returncode}")

              import time
              completed = False
              for attempt in range(1, 31):
                  status = __import__("subprocess").run(
                      ["kaggle", "kernels", "status", os.environ["KERNEL"]],
                      check=False,
                      text=True,
                      capture_output=True,
                  )
                  state = (status.stdout + status.stderr).strip()
                  print(f"Canonical Kaggle run status {attempt}/30: {state}")
                  if status.returncode == 0 and any(token in state for token in ("COMPLETE", "Complete", "complete")):
                      completed = True
                      break
                  if any(token in state for token in ("ERROR", "Error", "error", "CANCELLED", "Cancelled", "cancelled")):
                      raise SystemExit(f"Canonical Kaggle run failed: {state}")
                  time.sleep(30)
              if not completed:
                  raise SystemExit("Canonical Kaggle run did not complete within 15 minutes.")

              retry_dir = Path("remote_kernel_retry")
              retry_dir.mkdir(exist_ok=True)
              pull = __import__("subprocess").run(
                  ["kaggle", "kernels", "pull", os.environ["KERNEL"], "-p", str(retry_dir)],
                  check=False,
                  text=True,
                  capture_output=True,
              )
              print(pull.stdout)
              if pull.stderr:
                  print(pull.stderr)
              if pull.returncode:
                  raise SystemExit(f"Unable to retrieve canonical Kaggle source after push: {pull.returncode}")
              retry_paths = list(retry_dir.rglob("*.ipynb"))
              if len(retry_paths) != 1:
                  raise SystemExit(f"Expected one notebook after canonical push; found {[str(p) for p in retry_paths]}")
              remote = json.loads(retry_paths[0].read_text())
              actual = code_cells(remote)
              if expected != actual:
                  differing = [
                      index for index, (left, right) in enumerate(zip(expected, actual))
                      if left != right
                  ]
                  raise SystemExit(
                      "Kaggle source still differs after canonical push: "
                      f"canonical_code_cells={len(expected)}, remote_code_cells={len(actual)}, "
                      f"differing_cell_indexes={differing}"
                  )

          print(
              f"Verified {len(actual)} code cells match canonical ETI notebook "
              f"for {canonical_path}."
          )
          PY

      - name: Download latest Kaggle notebook output
        env:
          KERNEL: ${{ inputs.kernel || 'hamza00alik/eti-first-training-kaggle' }}
        run: |
          mkdir -p downloaded
          echo "Retrieving latest output for $KERNEL"
          kaggle kernels output "$KERNEL" -p downloaded
          echo "Downloaded files:"
          find downloaded -type f -printf '%p (%s bytes)\n' | sort

      - name: Inspect Kaggle execution log and preserve diagnostics
        if: always()
        run: |
          mkdir -p downloaded/diagnostics
          {
            echo "## Downloaded JSON and model files"
            find downloaded -type f \( -name '*.json' -o -name '*.joblib' -o -name '*.zip' \) -printf '%p (%s bytes)\n' | sort || true
            echo
            echo "## Kaggle notebook execution log (last 300 lines)"
            log_file="$(find downloaded -type f -name 'eti-first-training-kaggle.log' -print -quit)"
            if [ -n "$log_file" ]; then
              tail -n 300 "$log_file"
            else
              echo "No eti-first-training-kaggle.log was downloaded."
            fi
          } | tee downloaded/diagnostics/execution-diagnostics.txt

      - name: Validate and summarize ETI research report
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("downloaded")
          report_names = {"eti_budget_screen.json", "eti_training_metrics.json", "baseline_metrics.json"}
          reports = [p for p in root.rglob("*.json") if p.name in report_names]
          if not reports:
              available = [str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()]
              raise SystemExit(
                  "No ETI metrics JSON found. Expected eti_budget_screen.json, "
                  "eti_training_metrics.json, or baseline_metrics.json. "
                  f"Downloaded files: {available}"
              )

          reports.sort(key=lambda p: (p.name != "eti_budget_screen.json", -p.stat().st_mtime))
          report_path = reports[0]
          metrics = json.loads(report_path.read_text())
          if not isinstance(metrics, dict):
              raise SystemExit(f"ETI report must be a JSON object: {report_path}")

          # Reject stale, scan-only, partial, or over-budget output before
          # presenting it as a completed training run.
          if metrics.get("training_performed") is not True:
              raise SystemExit("ETI report does not confirm that model fitting completed.")
          if metrics.get("execution_enabled") is not False:
              raise SystemExit("ETI research artifact must explicitly keep execution disabled.")
          folds = metrics.get("folds")
          fold_count = metrics.get("fold_count")
          if not isinstance(folds, list) or not isinstance(fold_count, int) or fold_count < 1 or len(folds) != fold_count:
              raise SystemExit("ETI outer-test fold evidence is missing or inconsistent.")
          budget = metrics.get("compute_budget")
          if not isinstance(budget, dict):
              raise SystemExit("ETI compute-budget evidence is missing.")
          total_fits = budget.get("total_estimated_model_fit_calls")
          fit_cap = budget.get("max_model_fit_calls")
          if not isinstance(total_fits, int) or isinstance(total_fits, bool) or not 1 <= total_fits <= 32:
              raise SystemExit("ETI model-fit count is missing or exceeds the hard 32-fit cap.")
          if not isinstance(fit_cap, int) or isinstance(fit_cap, bool) or fit_cap > 32 or total_fits > fit_cap:
              raise SystemExit("ETI model-fit cap is invalid or exceeded.")
          source = metrics.get("market_data")
          if not isinstance(source, dict) or source.get("provider") not in {"coinbaseexchange", "kraken"}:
              raise SystemExit("ETI output does not identify the expected Coinbase/Kraken public data source.")
          if source.get("returned_candles", 0) < 662 or metrics.get("rows", 0) < 662:
              raise SystemExit("ETI output contains fewer than 662 candles/usable research rows.")
          scenarios = (metrics.get("cost_sensitivity") or {}).get("scenarios", [])
          if not any(isinstance(item, dict) and item.get("cost_multiplier") == 2.0 and item.get("fold_count") == fold_count for item in scenarios):
              raise SystemExit("ETI output is missing matching 2x-cost outer-test evidence.")

          exported = metrics.get("exported_model")
          if not isinstance(exported, dict):
              raise SystemExit("No exported_model manifest. Re-run the canonical Kaggle notebook with model export enabled.")
          digest = exported.get("artifact_sha256")
          uri = exported.get("artifact_uri")
          if not isinstance(digest, str) or len(digest) != 64 or not isinstance(uri, str) or not uri.endswith(digest):
              raise SystemExit("Invalid exported model URI/checksum manifest.")
          model_files = list(root.rglob(digest + ".joblib"))
          if len(model_files) != 1:
              raise SystemExit(f"Expected exactly one model artifact; found {[str(p) for p in model_files]}")
          model_path = model_files[0]
          actual_digest = hashlib.sha256(model_path.read_bytes()).hexdigest()
          if actual_digest != digest:
              raise SystemExit("Exported model checksum verification failed.")

          folds = metrics.get("folds") or []
          candidate_names = sorted({
              name for fold in folds if isinstance(fold, dict)
              for name in (fold.get("test_candidate_metrics") or {})
          })
          candidate_test_comparison = {}
          for name in candidate_names:
              rows = [
                  fold["test_candidate_metrics"][name]
                  for fold in folds
                  if name in (fold.get("test_candidate_metrics") or {})
              ]
              scored = [row for row in rows if isinstance(row, dict)]
              if scored:
                  ba = [float(row["balanced_accuracy"]) for row in scored if row.get("balanced_accuracy") is not None]
                  acc = [float(row["accuracy"]) for row in scored if row.get("accuracy") is not None]
                  candidate_test_comparison[name] = {
                      "folds_scored": len(scored),
                      "mean_balanced_accuracy": sum(ba) / len(ba) if ba else None,
                      "mean_accuracy": sum(acc) / len(acc) if acc else None,
                  }

          trading = metrics.get("trading_performance") or {}
          trading_summary = trading.get("summary", trading) if isinstance(trading, dict) else trading
          cost = metrics.get("cost_sensitivity") or {}
          summary = {
              "source_report": str(report_path),
              "training_performed": metrics.get("training_performed"),
              "rows": metrics.get("rows"),
              "fold_count": metrics.get("fold_count"),
              "horizon": metrics.get("horizon"),
              "timeframe": metrics.get("timeframe"),
              "mean_test_balanced_accuracy": metrics.get("mean_test_balanced_accuracy"),
              "test_balanced_accuracy_ci": metrics.get("test_balanced_accuracy_ci"),
              "candidate_summary": metrics.get("candidate_summary"),
              "candidate_outer_test_diagnostics": candidate_test_comparison,
              "selected_candidate_counts": {
                  name: sum(fold.get("selected_candidate") == name for fold in folds if isinstance(fold, dict))
                  for name in sorted({
                      fold.get("selected_candidate") for fold in folds
                      if isinstance(fold, dict) and fold.get("selected_candidate")
                  })
              },
              "trading_performance_summary": trading_summary,
              "cost_sensitivity": cost,
              "cost_assumptions": metrics.get("cost_assumptions"),
              "compute_budget": metrics.get("compute_budget"),
              "warning": metrics.get("warning"),
              "model_note": metrics.get("model_note"),
              "exported_model_present": True,
              "exported_model": {
                  "artifact_uri": uri,
                  "artifact_sha256": digest,
                  "artifact_file": str(model_path),
                  "artifact_bytes": model_path.stat().st_size,
                  "verified": True,
                  "input_schema": exported.get("input_schema"),
                  "calibration_status": exported.get("calibration_status"),
                  "training_data_ref": exported.get("training_data_ref"),
              },
              "candidate_archive_present": any(root.rglob("eti_candidate_0.1.0.zip")),
              "mobile_bundle_present": any(root.rglob("eti_mobile_model_bundle.zip")),
          }
          Path("training-summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("# ETI Kaggle research output\n\n")
              f.write(f"- Source report: `{summary['source_report']}`\n")
              f.write(f"- Training performed: `{summary['training_performed']}`\n")
              f.write(f"- Rows / folds: `{summary['rows']} / {summary['fold_count']}`\n")
              f.write(f"- Mean balanced accuracy: `{summary['mean_test_balanced_accuracy']}`\n")
              f.write(f"- Exported model present: `{summary['exported_model_present']}`\n\n")
              f.write("## Trading performance summary\n\n```json\n")
              f.write(json.dumps(summary["trading_performance_summary"], indent=2))
              f.write("\n```\n\n## Cost sensitivity\n\n```json\n")
              f.write(json.dumps(summary["cost_sensitivity"], indent=2))
              f.write("\n```\n")

          (Path("downloaded") / "source-report-path.txt").write_text(str(report_path))
          PY

      - name: Publish research report and compact summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eti-kaggle-training-output
          path: |
            downloaded/
          if-no-files-found: error
          retention-days: 30
